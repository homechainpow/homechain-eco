[package]
name = "home-miner"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
home-core = { path = "../home-core" }
